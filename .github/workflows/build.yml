# 构建镜像: Actions 页面 → "Build Docker Image" → Run workflow,
# 选择目标部署架构 (默认 x86_64) / 是否预装 opencode, 跑完在运行页下载 tar artifact
name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target deployment server architecture'
        type: choice
        options:
          - x86_64
          - arm64
        default: x86_64
      install-opencode:
        description: 'Bake opencode into the image (unchecked = skip; mount a binary at /opt/opencode/bin/opencode at runtime instead)'
        type: boolean
        default: false
      opencode-version:
        description: 'opencode version (empty = npm latest; only used when "Bake opencode" is checked)'
        required: false
        default: ''
      image-tag:
        description: 'Image tag'
        required: false
        default: latest
      oic-url:
        description: 'Oracle Instant Client Basic zip URL (empty = public default per arch; Oracle 11g needs this)'
        required: false
        default: ''
      archive-format:
        description: 'Archive format for the exported image'
        type: choice
        options:
          - tgz
          - zip
        default: tgz
  # 如需 push 时自动构建 x86_64, 取消注释:
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  build:
    # arm64 在 x86_64 runner 上走 QEMU 模拟构建, 可用但较慢;
    # 要快可用 arm 原生 runner: runs-on: ubuntu-24.04-arm (action 会自动跳过 QEMU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        id: build
        uses: ./              # 本仓库根目录的 action.yml
        with:
          arch: ${{ inputs.arch || 'x86_64' }}
          image-tag: ${{ inputs.image-tag || 'latest' }}
          install-opencode: ${{ inputs.install-opencode }}
          opencode-version: ${{ inputs.opencode-version }}
          oic-url: ${{ inputs.oic-url }}
          archive-format: ${{ inputs.archive-format || 'tgz' }}

      - name: Job summary
        shell: bash
        env:
          OC_INSTALLED: ${{ steps.build.outputs.opencode-installed }}
          OC_VERSION: ${{ steps.build.outputs.opencode-version }}
          OC_PATH: ${{ steps.build.outputs.opencode-path }}
        run: |
          {
            echo "## Build artifacts"
            echo
            echo "### Docker Image"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.build.outputs.image }}\` |"
            echo "| Platform | \`${{ steps.build.outputs.platform }}\` |"
            echo "| Archive | \`${{ steps.build.outputs.archive-path }}\` |"
            echo "| SHA256 | \`${{ steps.build.outputs.archive-sha256 }}\` |"
            echo
            echo "### opencode"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Baked into image | \`${OC_INSTALLED}\` |"
            echo "| Version | \`${OC_VERSION:-<none>}\` |"
            echo "| Binary path in image | \`${OC_PATH:-<none>}\` |"
            echo "| Hot-upgrade mount point | \`/opt/opencode/bin/opencode\` |"
            echo
            echo "### Source Code"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Archive | \`${{ steps.build.outputs.source-path }}\` |"
            echo "| SHA256 | \`${{ steps.build.outputs.source-sha256 }}\` |"
            echo
            echo "Download the \`release-linux-*\` artifact from this run's page."
            echo
            echo "On the server, load the docker image:"
            echo '```bash'
            echo 'docker load -i <archive>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
